<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>前置 60 帧检查</title>
  <style>
    :root{color-scheme:light;background:#f6f1e8;color:#27231f;font:100%/1.55 system-ui,sans-serif}
    body{max-width:34rem;margin:auto;padding:1.5rem 1rem}
    h1{font-size:1.65rem;margin:0}
    button{font:inherit;color:#fff;background:#933d34;border:0;border-radius:.65rem;padding:.65rem .9rem;margin-bottom:.5rem}
    button:disabled{opacity:.65}
    #copy,#stop{background:#39332c}
    video{width:100%;max-height:34vh;display:block;background:#292521;object-fit:contain;border-radius:.8rem}
    [hidden]{display:none}
    pre{font:inherit;background:#fff;padding:1rem;border-radius:.8rem;white-space:pre-wrap;overflow-wrap:anywhere}
    a{color:#71352e}
  </style>
  <main>
    <h1>前置 1080P／60 帧检查</h1>
    <p>关掉其他正在取景的标签页。保持手机竖直、光线充足，测试时说几句话。测试短片只在手机内分析。</p>
    <button id="start">对照第一版和镜像录制</button>
    <button id="scan">检查前后镜头的帧率</button>
    <button id="device-scan">按设备 ID 对照前置 60 帧</button>
    <button id="stop" hidden>停止测试</button>
    <p id="status" role="status"></p>
    <video id="preview" autoplay muted playsinline hidden aria-label="前置相机测试取景"></video>
    <pre id="result" hidden></pre>
    <button id="copy" hidden>复制检查结果</button>
    <p><a href="./">返回提词器</a></p>
  </main>
  <script type="module" src="./src/front-60-check.ts"></script>
</html>
